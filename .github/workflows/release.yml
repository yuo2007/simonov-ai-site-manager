name: Release

# Pushing a tag like v0.6.1 builds the installable ZIP and publishes it as a
# GitHub release. Updater reads that release, so this workflow is what makes
# the "Update now" button appear on every site running the plugin.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag agrees with the plugin version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' simonov-ai-site-manager.php | head -n1)
          CONST=$(sed -n "s/^define( 'WPMCP_VERSION', '\(.*\)' );$/\1/p" simonov-ai-site-manager.php | head -n1)
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*\(.*\)$/\1/p' readme.txt | head -n1)
          echo "tag=$TAG header=$HEADER const=$CONST stable=$STABLE"
          # A tag that disagrees with the header would have every site offered
          # an update that installs the same version again, forever.
          for pair in "header:$HEADER" "WPMCP_VERSION:$CONST" "readme Stable tag:$STABLE"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "$TAG" != "$value" ]; then
              echo "::error::$name is '$value' but the tag is '$TAG'"
              exit 1
            fi
          done

      - name: Build the ZIP
        run: |
          set -euo pipefail
          # The folder inside the archive decides where WordPress installs the
          # plugin, so it has to be the plugin slug and nothing else.
          mkdir -p .distbuild/simonov-ai-site-manager
          rsync -a --exclude-from=.distignore ./ .distbuild/simonov-ai-site-manager/
          cd .distbuild
          zip -qr ../simonov-ai-site-manager.zip simonov-ai-site-manager
          cd ..
          unzip -l simonov-ai-site-manager.zip

      - name: Collect the release notes from readme.txt
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          awk -v want="= $TAG =" '
            $0 == want { grab = 1; next }
            grab && /^= .* =$/ { exit }
            grab { print }
          ' readme.txt > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $TAG in readme.txt." > notes.md
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" simonov-ai-site-manager.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
